image_size: 640

data:
  data_path: "/Users/orram/Tensorleap/data/warehouse"
  annotations_file: "dataset/labels/loco-all-v1.json"

model_path: "yolo11s.onnx"
model_type: "YOLO11"

output_indices:
  labels: 0
  boxes: 1
  scores: 2
  pred_logits: 3
  pred_boxes: 4

max_num_of_objects: 400

split:
  train_subsets:
    - "subset-2"
    - "subset-4"
    - "subset-5"
    - "subset-1"
  val_subsets:
    - "subset-3"

categories:
  - {coco_id: 3,  name: small_load_carrier, idx: 0}
  - {coco_id: 5,  name: forklift,           idx: 1}
  - {coco_id: 7,  name: pallet,             idx: 2}

loss:
  map_coco_category_to_label: false
  weight_dict:
    loss_vfl: 1.0
    loss_bbox: 5.0
    loss_giou: 2.0
  alpha: 0.75
  gamma: 2.0
  matcher:
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2.0

max_samples:    # null = no limit; set to e.g. 100 to cap each subset

score_threshold: 0.3
max_detections: 300
plot_visualizers: true
check_subset_index: 0
check_sample_index: 0

base_synth_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/base_v2_final"
  additional: true          # flat exp*/ directory structure (no palletjack_run_* wrapper needed)
  num_samples:            # null = no limit; per-experiment cap after deterministic shuffle

extended_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/extended"
  additional: false          # set to false to exclude extended data entirely
  extended_numbers:      # null = include all; list of ints to include specific iterations e.g. [1, 2] (matches trailing number in folder name like camera-01)
  num_samples:              # null = no limit; per-run cap (same semantics as synth_data.num_samples)

Tensorleap-Optimized:
  base_path: "/Users/orram/Tensorleap/data/warehouse/top-runs-may-ok"
  additional: true          # set to false to exclude optuna-generated data entirely
  num_samples:

optuna_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/optuna-ec2"
  additional: false          # set to false to exclude optuna-generated data entirely
  num_samples:              # null = no limit; per-experiment cap after deterministic shuffle

dino_distances_csv: "simulation_calibration_loop/population_view/dino-population_top_performance.csv"

