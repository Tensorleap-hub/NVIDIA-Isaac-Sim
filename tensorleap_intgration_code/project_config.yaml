image_size: 560

data:
  data_path: "/Users/orram/Tensorleap/data/warehouse"
  annotations_file: "dataset/labels/loco-all-v1.json"

model_path: "rfdetr-base-fixed.onnx"
model_type: "RFDETR"

max_num_of_objects: 300

split:
  train_subsets:
    - "subset-2"
#    - "subset-4"
#    - "subset-5"
#    - "subset-1"
  val_subsets:
    - "subset-3"

categories:
  - {coco_id: 3,  name: small_load_carrier, idx: 0}
  - {coco_id: 5,  name: forklift,           idx: 1}
  - {coco_id: 7,  name: pallet,             idx: 2}

loss:
  map_coco_category_to_label: false
  weight_dict:
    loss_vfl: 1.0
    loss_bbox: 5.0
    loss_giou: 2.0
  alpha: 0.75
  gamma: 2.0
  matcher:
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2.0

max_samples:   # null = no limit; set to e.g. 100 to cap each subset

score_threshold: 0.3
max_detections: 300
plot_visualizers: true
check_subset_index: 0
check_sample_index: 0

base_synth_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/base_v2_final"
  additional: true          # flat exp*/ directory structure (no palletjack_run_* wrapper needed)
  num_samples:              # null = no limit; per-experiment cap after deterministic shuffle

synth_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse"
  additional: false # set to false to exclude synthetic data entirely
#  run_numbers: [0,1,2,3,4,5] # null = include all runs; list of ints to include specific runs e.g. [1, 3, 5]
  run_numbers: [0,1,2,3,4,5]
  num_samples:            # null = no limit; set to e.g. 500 to cap additional dataset size
                                 #   (data is shuffled before capping and sampling keeps experiments run relative sizes)

extended_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/extended"
  additional: false          # set to false to exclude extended data entirely
  extended_numbers:      # null = include all; list of ints to include specific iterations e.g. [1, 2] (matches trailing number in folder name like camera-01)
  num_samples:              # null = no limit; per-run cap (same semantics as synth_data.num_samples)

optuna_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/optuna-ec2"
  additional: false          # set to false to exclude optuna-generated data entirely
  num_samples:              # null = no limit; per-experiment cap after deterministic shuffle

optuna_tests_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/optuna_tests"
  additional: false          # set to false to exclude optuna test datasets entirely
  tests:                   # null = include all; list like [camera] to include only test_camera
  num_samples:              # null = no limit; per-run cap after deterministic shuffle

cosmos_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse"
  additional: true          # set to false to exclude cosmos original/stylized comparison data
  cosmos_only: false        # when true, train/val are built ONLY from the cosmos datasets below (no LOCO/synth)
  num_samples:              # null = no limit; per-dataset cap after deterministic shuffle
  run_config_roots:
    - "/Users/orram/Tensorleap/data/warehouse/20260708_cosmos_v4"
    - "/Users/orram/Tensorleap/data/warehouse/20260712_cosmos_v4"
    - "/Users/orram/Tensorleap/data/warehouse/20260712_cosmos_optuna"
  # COCO datasets (train+valid loaded together), each tagged with render_type + source_group metadata.
  # cosmos categories (pallet_truck/forklift/pallet = ids 1/2/3) are remapped to config coco_ids 3/5/7.
  datasets:
    - {dir: "warehouse3cls_cosmos_themes",          render_type: cosmos,   source_group: themes}
    - {dir: "warehouse3cls_cosmos_themes_original", render_type: original, source_group: themes}
    - {dir: "warehouse3cls_cosmos_optuna",          render_type: cosmos,   source_group: optuna}
    - {dir: "warehouse3cls_cosmos_optuna_original", render_type: original, source_group: optuna}

dino_latent_space:
  cache_dir: "/Users/orram/Tensorleap/data/warehouse/dino_ls_cache"
  repo: "facebookresearch/dinov2"
  model_name: "dinov2_vitb14_reg"
  device:            # null = auto (cuda / mps / cpu)
  image_size: 224
  resize_size: 256
  batch_size: 16

custom_latent_space:
  # Disabled for the cosmos original-vs-stylized push (cosmos_data.cosmos_only). Restore to
  # re-enable the DINO latent-space mode.
  real_cache_manifest:   # "simulation_calibration_loop/population_view/cache/real_data_0e27b2406dc30ae9_dinov2_vitb14_reg.manifest.json"
  base_cache_manifest:   # "simulation_calibration_loop/population_view/cache/base_9a2b9d15e33c5661_dinov2_vitb14_reg.manifest.json"  # base_v2_final, 4160 images
  runs_root:             # "/Users/orram/Tensorleap/data/warehouse/top-runs-may-ok"

sample_selection_filter:
  # When enabled, restricts the "additional" state to only selected sample_ids.
  # train/val (subset-3 real data) are never filtered. `option` picks which selection:
  #   baseline            - scripts/latent_space_subset3_proximity.py's plain output: closest-to-
  #                         subset-3 for TL-opt/TL-opt+cosmos, full decile-stratified spread for
  #                         base_synth/base_synth+cosmos.
  #   bbox80              - same as baseline, but base_synth's spread is split so >=80% of its
  #                         selected samples have metadata_# of objects > 0 ("some bbox").
  #   manual_plus_cosmos  - the 500 hand-picked TL-opt/base_synth (non-cosmos) samples in
  #                         manual_csv_path, unioned with the TL-opt+cosmos/base_synth+cosmos rows
  #                         from csv_path (the manual export has no cosmos rows of its own).
  enabled: true
  option: "baseline"   # one of: baseline | bbox80 | manual_plus_cosmos
  latent_space: "labels-semantic"
  csv_path: "comparison_subset3_proximity_by_ls.csv"
  bbox80_csv_path: "comparison_subset3_proximity_by_ls_base_synth_bbox80.csv"
  manual_csv_path: "manual_base_tlopt_selection_500.csv"
