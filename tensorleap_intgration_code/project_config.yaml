image_size: 560

data:
  data_path: "/Users/orram/Tensorleap/data/warehouse"
  annotations_file: "dataset/labels/loco-all-v1.json"

model_path: "rfdetr-base.onnx"
model_type: "RFDETR"

max_num_of_objects: 300

split:
  train_subsets:
    - "subset-2"
#    - "subset-4"
#    - "subset-5"
#    - "subset-1"
  val_subsets:
    - "subset-3"

categories:
  - {coco_id: 3,  name: small_load_carrier, idx: 0}
  - {coco_id: 5,  name: forklift,           idx: 1}
  - {coco_id: 7,  name: pallet,             idx: 2}

loss:
  map_coco_category_to_label: false
  weight_dict:
    loss_vfl: 1.0
    loss_bbox: 5.0
    loss_giou: 2.0
  alpha: 0.75
  gamma: 2.0
  matcher:
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2.0

max_samples:   # null = no limit; set to e.g. 100 to cap each subset

score_threshold: 0.3
max_detections: 300
plot_visualizers: true
check_subset_index: 0
check_sample_index: 0

base_synth_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/base_v2_final"
  additional: true          # flat exp*/ directory structure (no palletjack_run_* wrapper needed)
  num_samples:              # null = no limit; per-experiment cap after deterministic shuffle

synth_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse"
  additional: false # set to false to exclude synthetic data entirely
#  run_numbers: [0,1,2,3,4,5] # null = include all runs; list of ints to include specific runs e.g. [1, 3, 5]
  run_numbers: [0,1,2,3,4,5]
  num_samples:            # null = no limit; set to e.g. 500 to cap additional dataset size
                                 #   (data is shuffled before capping and sampling keeps experiments run relative sizes)

extended_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/extended"
  additional: false          # set to false to exclude extended data entirely
  extended_numbers:      # null = include all; list of ints to include specific iterations e.g. [1, 2] (matches trailing number in folder name like camera-01)
  num_samples:              # null = no limit; per-run cap (same semantics as synth_data.num_samples)

optuna_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/optuna-ec2"
  additional: false          # set to false to exclude optuna-generated data entirely
  num_samples:              # null = no limit; per-experiment cap after deterministic shuffle

optuna_tests_data:
  base_path: "/Users/orram/Tensorleap/data/warehouse/optuna_tests"
  additional: false          # set to false to exclude optuna test datasets entirely
  tests:                   # null = include all; list like [camera] to include only test_camera
  num_samples:              # null = no limit; per-run cap after deterministic shuffle

custom_latent_space:
  real_cache_manifest: "simulation_calibration_loop/population_view/cache/real_data_0e27b2406dc30ae9_dinov2_vitb14_reg.manifest.json"
  base_cache_manifest: "simulation_calibration_loop/population_view/cache/base_9a2b9d15e33c5661_dinov2_vitb14_reg.manifest.json"  # base_v2_final, 4160 images
  runs_root: "/Users/orram/Tensorleap/data/warehouse/top-runs-may-ok"
