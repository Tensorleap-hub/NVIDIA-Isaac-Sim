[tool.poetry]
name = "synth-bench"
version = "0.1.0"
description = "Convergence benchmark: Optuna vs TL suggester"
authors = []
packages = [{include = "convergence"}, {include = "benchmark_integration"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.24"
Pillow = ">=9.0"
torch = ">=2.0"
torchvision = ">=0.15"
onnxruntime = ">=1.16,<1.24"
optuna = ">=3.0"
pandas = ">=1.5"
matplotlib = ">=3.5"
scipy = ">=1.9"
scikit-learn = ">=1.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
code-loader = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
