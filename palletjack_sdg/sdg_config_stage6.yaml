# Trajectory SDG config for OD synthetic data.
# Default agent: ghost camera that teleports along an occupancy-planned path.
# Robot body is not in the labels for an OD task and physics-driven Carter
# generates stuck trajectories, so the ghost gives more useful frames.
# Carter is still available — set agent.type: carter to switch back.

extends: sdg_config_mean_std.yaml

run:
  headless: true
  num_frames: 60
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/trajectory_stage6

simulation:
  mode: trajectory
  physics_dt: 0.0166667

environment:
  name: full_warehouse

# Stage 7: animated human characters scattered in the warehouse as
# additional OD targets. Each character is spawned with class "person"
# semantic so BasicWriter's bounding_box_2d_tight picks them up.
characters:
  enabled: true
  count: 5
  semantic_class: person
  spawn_bounds_xy: [-5.0, 5.0, -5.0, 7.0]
  # Stage 7b-1: apply the Biped_Setup animation graph to each character.
  # `enabled: true` → characters render in the graph's Idle state (natural
  # standing / breathing pose) instead of the skeleton's T-pose rest.
  # Requires the omni.anim.* extensions; if any fail to load, characters
  # fall back to T-pose without crashing the episode.
  animation:
    enabled: true
    # Stage 7b-2: basic movement via omni.anim.people command file.
    # `enabled: true` → each character gets a short randomized command loop
    # (Idle / LookAround / GoTo) so they walk instead of standing still.
    # Navmesh is off — GoTo walks straight lines, so keep goto_max_dist_m
    # small enough that characters don't wander into shelves/walls.
    movement:
      enabled: true
      commands_per_char: 3
      idle_prob: 0.4
      lookaround_prob: 0.2
      goto_prob: 0.4
      idle_duration_range: [3.0, 6.0]
      lookaround_duration_range: [5.0, 10.0]
      goto_max_dist_m: 2.5
  assets:
    - /Isaac/People/Characters/F_Business_02/F_Business_02.usd
    - /Isaac/People/Characters/F_Medical_01/F_Medical_01.usd
    - /Isaac/People/Characters/M_Medical_01/M_Medical_01.usd
    - /Isaac/People/Characters/female_adult_police_01_new/female_adult_police_01_new.usd
    - /Isaac/People/Characters/female_adult_police_02/female_adult_police_02.usd
    - /Isaac/People/Characters/female_adult_police_03_new/female_adult_police_03_new.usd
    - /Isaac/People/Characters/male_adult_construction_01_new/male_adult_construction_01_new.usd
    - /Isaac/People/Characters/male_adult_construction_03/male_adult_construction_03.usd
    - /Isaac/People/Characters/male_adult_construction_05_new/male_adult_construction_05_new.usd
    - /Isaac/People/Characters/male_adult_police_04/male_adult_police_04.usd

agent:
  type: camera_rig              # ghost camera (default). carter = physics robot.
  start_mode: fixed
  start_pose: [0.0, -5.0, 1.6, 0.0, 0.0, 0.0]
  # carter-only (ignored for camera_rig):
  usd_path: /Isaac/Robots/NVIDIA/NovaCarter/nova_carter.usd
  speed_mps: 2.5
  turn_rate_dps: 90.0
  capture_dt: 0.4

trajectory:
  mode: occupancy_path
  bounds_xy: [-12.0, 12.0, -12.0, 14.0]
  occupancy:
    cell_size_m: 0.1
    z_slice_m: 1.6
    buffer_m: 1.0
    boundary_margin_m: 2.5
    min_path_m: 4.0
    max_retries: 20

cameras:
  ego:
    enabled: true
    parent: agent
    resolution: [960, 544]
    fov_mean: 75.0
    fov_std: 0.0
    projection: perspective
    shutter_close_fraction: 0.5
    f_stop: 0.0
    focus_distance_m: 5.0
    fisheye:
      enabled: false
      k1: -0.20
      k2: 0.04
      k3: 0.00
      k4: 0.00
    height_m: 1.40
    pitch_deg: 0.0
    roll_deg: 0.0
    pitch_jitter:
      amp_deg: 2.0
      hz: 1.5
    roll_jitter:
      amp_deg: 1.5
      hz: 1.2
    lateral_jitter:
      amp_m: 0.03
      hz: 1.3
    vertical_jitter:
      amp_m: 0.02
      hz: 2.0
    mount:
      forward_m: 0.30
      lateral_m: 0.00
  chase:
    enabled: true
    resolution: [960, 544]
    distance_m: 3.5
    height_m: 2.0

capture:
  rgb: true
  bounding_box_2d_tight: true
  semantic_segmentation: false
  depth: false
  video: true
  metadata: true
