# Stage-4 trajectory SDG config.
# Ghost camera moves along a fixed waypoint list; warehouse is loaded once.

extends: sdg_config_mean_std.yaml

run:
  headless: true
  num_frames: 30
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/trajectory_stage4

simulation:
  mode: trajectory
  physics_dt: 0.0166667

environment:
  name: full_warehouse

agent:
  type: camera_rig
  start_mode: fixed
  start_pose: [0.0, -5.0, 1.6, 0.0, 0.0, 0.0]
  speed_mps: 0.8
  turn_rate_dps: 90.0

trajectory:
  mode: waypoint_list
  # [x, y, z, roll, pitch, yaw_relative_to_travel]
  # roll=90 keeps camera upright; yaw is relative to direction of travel
  # (0=straight ahead, +90=look left, -90=look right).
  waypoints:
    - [0.0, -5.0, 1.6,  90.0, 0.0,  0.0]
    - [3.0,  0.0, 1.6,  90.0, 0.0,  0.0]
    - [0.0,  5.0, 1.6,  90.0, 0.0,  0.0]
  bounds_xy: [-6.0, 6.0, -6.0, 8.0]

cameras:
  ego:
    enabled: true
    parent: agent
    resolution: [960, 544]
    height_m: 1.6
    fov_mean: 75.0
    fov_std: 5.0
  chase:
    enabled: true
    resolution: [960, 544]
    distance_m: 3.0
    height_m: 2.0

capture:
  rgb: true
  bounding_box_2d_tight: true
  semantic_segmentation: false
  depth: false
  video: true
  metadata: true
