# Stage-1 trajectory SDG config.
# Ghost camera moves along a fixed waypoint list; warehouse is loaded once.

extends: sdg_config_mean_std.yaml

run:
  headless: true
  num_frames: 30
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/trajectory_stage1

simulation:
  mode: trajectory
  physics_dt: 0.0166667

environment:
  name: full_warehouse

agent:
  type: camera_rig
  start_mode: fixed
  start_pose: [0.0, -5.0, 1.6, 0.0, 0.0, 0.0]
  speed_mps: 0.8
  turn_rate_dps: 90.0

trajectory:
  mode: waypoint_list
  waypoints:
    - [0.0, -5.0, 1.6,  0.0, 0.0,   0.0]
    - [3.0,  0.0, 1.6,  0.0, 0.0,  45.0]
    - [0.0,  5.0, 1.6,  0.0, 0.0,  90.0]
  bounds_xy: [-6.0, 6.0, -6.0, 8.0]

cameras:
  ego:
    enabled: true
    parent: agent
    resolution: [960, 544]
    height_m: 1.6
    fov_mean: 75.0
    fov_std: 0.0
  chase:
    enabled: false

capture:
  rgb: true
  bounding_box_2d_tight: false
  semantic_segmentation: false
  depth: false
  video: false
  metadata: true
