# Stage-5 trajectory SDG config.
# Ghost camera follows a random free-space path sampled from an occupancy map.

extends: sdg_config_mean_std.yaml

run:
  headless: true
  num_frames: 30
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/trajectory_stage5

simulation:
  mode: trajectory
  physics_dt: 0.0166667

environment:
  name: full_warehouse

agent:
  type: camera_rig
  start_mode: fixed
  start_pose: [0.0, -5.0, 1.6, 0.0, 0.0, 0.0]
  speed_mps: 0.8
  turn_rate_dps: 90.0

trajectory:
  mode: occupancy_path       # occupancy_path | waypoint_list
  bounds_xy: [-12.0, 12.0, -12.0, 14.0]
  occupancy:
    cell_size_m: 0.1         # occupancy map resolution
    z_slice_m: 1.0           # height (m) at which to scan for obstacles
    buffer_m: 1.0            # safety margin dilated around obstacles
    boundary_margin_m: 2.5   # virtual wall at scan edges (prevents running into undetected walls)
    min_path_m: 3.0          # reject paths shorter than this
    max_retries: 20          # attempts before raising an error
  # fallback waypoints used when mode: waypoint_list
  waypoints:
    - [0.0, -5.0, 1.6,  90.0, 0.0,  0.0]
    - [3.0,  0.0, 1.6,  90.0, 0.0,  0.0]
    - [0.0,  5.0, 1.6,  90.0, 0.0,  0.0]

cameras:
  ego:
    enabled: true
    parent: agent
    resolution: [960, 544]
    height_m: 1.6
    fov_mean: 75.0
    fov_std: 5.0
  chase:
    enabled: true
    resolution: [960, 544]
    distance_m: 3.0
    height_m: 2.0

capture:
  rgb: true
  bounding_box_2d_tight: true
  semantic_segmentation: false
  depth: false
  video: true
  metadata: true
