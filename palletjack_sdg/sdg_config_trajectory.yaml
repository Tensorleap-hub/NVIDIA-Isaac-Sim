# Trajectory SDG config for OD synthetic data.
#
# Standalone (no `extends:`) — every field the trajectory script consumes is
# inlined here so schema inference for simulation_calibration_loop sees the
# complete surface. Random-frame-only fields from the old sdg_config_mean_std
# base (`camera.*`, `image_augmentation.*`, `dataset_noise`, `output.*`,
# `pallet_stacks`, legacy noise/jpeg knobs) are intentionally absent — the
# trajectory script does not read them.
#
# Default agent: ghost camera that teleports along an occupancy-planned path.
# Robot body is not in OD labels and physics-driven Carter generates stuck
# trajectories, so the ghost gives more useful frames. Carter is still
# available — set agent.type: carter to switch back.

run:
  headless: true
  num_frames: 60
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/trajectory

render:
  width: 960
  height: 544

simulation:
  mode: trajectory
  physics_dt: 0.0166667

environment:
  name: full_warehouse

environment_urls:
  warehouse: /Isaac/Environments/Simple_Warehouse/warehouse.usd
  full_warehouse: /Isaac/Environments/Simple_Warehouse/full_warehouse.usd
  warehouse_multiple_shelves: /Isaac/Environments/Simple_Warehouse/warehouse_multiple_shelves.usd
  warehouse_with_forklifts: /Isaac/Environments/Simple_Warehouse/warehouse_with_forklifts.usd

# Stage 7: animated human characters scattered in the warehouse as
# additional OD targets. Each character is spawned with class "person"
# semantic so BasicWriter's bounding_box_2d_tight picks them up.
characters:
  enabled: true
  count: 5
  semantic_class: person
  spawn_bounds_xy: [-5.0, 5.0, -5.0, 7.0]
  # Stage 7b-1: apply the Biped_Setup animation graph to each character.
  # `enabled: true` → characters render in the graph's Idle state (natural
  # standing / breathing pose) instead of the skeleton's T-pose rest.
  # Requires the omni.anim.* extensions; if any fail to load, characters
  # fall back to T-pose without crashing the episode.
  animation:
    enabled: true
    # Stage 7b-2: basic movement via omni.anim.people command file.
    # `enabled: true` → each character gets a short randomized command loop
    # (Idle / LookAround / GoTo) so they walk instead of standing still.
    # Navmesh is off — GoTo walks straight lines, so keep goto_max_dist_m
    # small enough that characters don't wander into shelves/walls.
    movement:
      enabled: true
      commands_per_char: 3
      idle_prob: 0.4
      lookaround_prob: 0.2
      goto_prob: 0.4
      idle_duration_range: [3.0, 6.0]
      lookaround_duration_range: [5.0, 10.0]
      goto_max_dist_m: 2.5
  assets:
    - /Isaac/People/Characters/F_Business_02/F_Business_02.usd
    - /Isaac/People/Characters/F_Medical_01/F_Medical_01.usd
    - /Isaac/People/Characters/M_Medical_01/M_Medical_01.usd
    - /Isaac/People/Characters/female_adult_police_01_new/female_adult_police_01_new.usd
    - /Isaac/People/Characters/female_adult_police_02/female_adult_police_02.usd
    - /Isaac/People/Characters/female_adult_police_03_new/female_adult_police_03_new.usd
    - /Isaac/People/Characters/male_adult_construction_01_new/male_adult_construction_01_new.usd
    - /Isaac/People/Characters/male_adult_construction_03/male_adult_construction_03.usd
    - /Isaac/People/Characters/male_adult_construction_05_new/male_adult_construction_05_new.usd
    - /Isaac/People/Characters/male_adult_police_04/male_adult_police_04.usd

agent:
  type: camera_rig              # ghost camera (default). carter = physics robot.
  start_mode: fixed
  start_pose: [0.0, -5.0, 1.6, 0.0, 0.0, 0.0]
  # carter-only (ignored for camera_rig):
  usd_path: /Isaac/Robots/NVIDIA/NovaCarter/nova_carter.usd
  speed_mps: 2.5
  turn_rate_dps: 90.0
  capture_dt: 0.4

trajectory:
  mode: occupancy_path
  bounds_xy: [-12.0, 12.0, -12.0, 14.0]
  occupancy:
    cell_size_m: 0.1
    # Scan at camera height — sees walls/shelves at full extent.
    z_slice_m: 1.6
    # Ghost camera can't get stuck, so the buffer is just to keep the camera
    # off the walls. Stage 5's 1.0m default works well.
    buffer_m: 1.0
    boundary_margin_m: 2.5
    min_path_m: 4.0
    max_retries: 20

cameras:
  ego:
    enabled: true
    parent: agent
    resolution: [960, 544]

    # Lens — two ways to specify focal length:
    #   (a) fov_mean / fov_std → focal_length back-solved from sensor aperture
    #   (b) focal_length_mm    → directly set (matches a calibrated lens spec);
    #                            FOV is back-solved from it for logging
    # If focal_length_mm is set, fov_mean/std are ignored. Aperture defaults
    # to a 35mm-equivalent sensor (20.955mm) but can be overridden.
    fov_mean: 75.0
    fov_std: 0.0
    # focal_length_mm: 12.0        # uncomment to override (in millimetres)
    # horizontal_aperture_mm: 20.955
    projection: perspective       # perspective | orthographic
    # Motion blur: shutter_close_fraction is fraction of frame interval the
    # shutter stays open. 0 = no blur (sharp), 0.5 = cinematic 180° shutter,
    # 1.0 = max blur. Camera pose is written as time samples at shutter_open
    # and shutter_close each frame so the renderer can integrate.
    shutter_close_fraction: 0.5

    # Depth of field. f_stop = 0 → pinhole (everything sharp, default).
    # f_stop > 0 → real lens with finite aperture, focus_distance_m sharp,
    # near/far progressively blurred. Lower f_stop = shallower DOF.
    f_stop: 0.0
    focus_distance_m: 5.0
    # Fisheye post-render. USD natively supports only perspective/ortho, so
    # we render perspective at the configured FOV, then apply OpenCV's
    # fisheye distortion model to each RGB frame after capture. Output goes
    # to Camera/rgb_fisheye/ (originals in Camera/rgb/ are untouched, so
    # bounding-box labels for OD remain valid for the perspective pipeline).
    # k1..k4 are the standard OpenCV fisheye coefficients; negative k1 gives
    # the classic warehouse/dashcam barrel look.
    fisheye:
      enabled: false
      k1: -0.20
      k2: 0.04
      k3: 0.00
      k4: 0.00

    # Static mount — applied for both camera_rig (ghost) and carter
    height_m: 1.40                # ghost: world-frame Z; carter: above chassis_link
    pitch_deg: 0.0                # +ve = nose up
    roll_deg: 0.0                 # +ve = right side down

    # Per-frame orientation jitter — simulates handheld camera / walking
    # gait / vehicle bounce on uneven floor. Sinusoidal with random
    # per-episode phase so each trajectory has its own rhythm.
    pitch_jitter:
      amp_deg: 2.0                # peak amplitude (0 = disabled)
      hz: 1.5                     # oscillation frequency
    roll_jitter:
      amp_deg: 1.5
      hz: 1.2
    # Per-frame position jitter (meters) — side-to-side sway + up/down
    # gait bounce, relative to the camera's heading. 0 = disabled.
    lateral_jitter:
      amp_m: 0.03                 # ±3cm side-to-side
      hz: 1.3
    vertical_jitter:
      amp_m: 0.02                 # ±2cm bounce
      hz: 2.0                     # walking gait is ~2 Hz

    # Carter-only mount offsets (relative to chassis_link, ignored for ghost):
    mount:
      forward_m: 0.30
      lateral_m: 0.00
  chase:
    enabled: true
    resolution: [960, 544]
    distance_m: 3.5
    height_m: 2.0

capture:
  rgb: true
  bounding_box_2d_tight: true
  semantic_segmentation: false
  depth: false
  video: true
  metadata: true

# ── Scene object randomization (inlined from the removed mean_std base) ──────
# Every _mean / _std pair is sampled per episode by the trajectory script
# (see palletjack_sdg/standalone_palletjack_trajectory_sdg.py:960–1027).

palletjacks:
  count_per_model: 2
  assets:
    - "http://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/DigitalTwin/Assets/Warehouse/Equipment/Pallet_Trucks/Scale_A/PalletTruckScale_A01_PR_NVD_01.usd"
    - "http://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/DigitalTwin/Assets/Warehouse/Equipment/Pallet_Trucks/Heavy_Duty_A/HeavyDutyPalletTruck_A01_PR_NVD_01.usd"
    - "http://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/DigitalTwin/Assets/Warehouse/Equipment/Pallet_Trucks/Low_Profile_A/LowProfilePalletTruck_A01_PR_NVD_01.usd"
  position_mean: [0.0, 3.0, 0.0]
  position_std: [3.464102, 5.196152, 0.0]
  rotation_mean: [0.0, 0.0, 180.0]
  rotation_std: [0.0, 0.0, 103.923048]
  scale_mean: [0.01, 0.01, 0.01]
  scale_std: [0.0, 0.0, 0.0]
  # Body-color randomization (restored from the random-frame sampler; targets
  # the SteerAxles body prims of the pallet-truck assets). Per-experiment YAMLs
  # override via extends:
  #   color_mean — the actual color; with color_std [0,0,0] it is pinned exactly
  #   color_std  — allowed randomness around color_mean
  #   color_mean: null — disable entirely (keep authored asset materials)
  color_mean: [0.5, 0.5, 0.5]
  color_std: [0.288675, 0.288675, 0.288675]

