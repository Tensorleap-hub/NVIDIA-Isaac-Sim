extends: sdg_config_trajectory.yaml

run:
  data_dir: /home/ubuntu/NVIDIA-Isaac-Sim/palletjack_sdg/palletjack_data/trajectory_test_yaw_fix
  num_frames: 10

simulation:
  seed: 0

trajectory:
  mode: waypoint_list
  # yaw_rel=30: ego looks 30deg left of travel; chase must still face travel heading
  waypoints:
    - [0.0, -5.0, 1.6,  90.0, 0.0, 30.0]
    - [3.0,  0.0, 1.6,  90.0, 0.0, 30.0]
    - [0.0,  5.0, 1.6,  90.0, 0.0, 30.0]

cameras:
  chase:
    enabled: true
    resolution: [960, 544]
    distance_m: 3.0
    height_m: 2.0
