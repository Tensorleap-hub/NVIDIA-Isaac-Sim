extends: ../../../sdg_config_mean_std.yaml

run:
  num_frames: 128
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/base_v2/exp33_pallet_stacks_low_light

# Many tall stacks in dark warehouse with shot noise. Forklift disabled to
# isolate stacks + palletjacks under challenging low-light conditions.

pallet_stacks:
  enabled: true
  num_stacks: 5
  layers: 5

distractors:
  clutter_level: 0.8
  groups:

camera:
  camera_height_mean: 1.8
  camera_height_std: 0.3
  camera_tilt_mean: -12.0
  camera_tilt_std: 4.0
  camera_yaw_std: 90
  fov_mean: 76.0
  fov_std: 5.0
  dataset_noise:
    mode: shot
    shot_scale_mean: 70.0
    shot_scale_std: 25.0

lighting:
  intensity_mean: 15000.0
  intensity_std: 25000.0
  visibility_choices: [true, false, false, false, false, false, false, false, false, false]

forklifts:
  count_per_model: 0
pallets:
  count_per_model: 0
