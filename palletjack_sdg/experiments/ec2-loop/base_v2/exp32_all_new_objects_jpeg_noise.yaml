extends: ../../../sdg_config_mean_std.yaml

run:
  num_frames: 128
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/base_v2/exp32_all_new_objects_jpeg_noise

# All new objects active: forklift, pallet stacks, DT cardboard boxes, pallet
# distractors. JPEG compression noise adds sensor realism. Mixed mid-height view.

pallet_stacks:
  num_stacks: 4
  layers: 4

distractors:
  clutter_level: 1.2
  groups:
    CardBox:
      diversity: 5
      occurrence: 3

camera:
  camera_height_mean: 2.0
  camera_height_std: 0.4
  camera_tilt_mean: -15.0
  camera_tilt_std: 5.0
  camera_yaw_std: 90
  fov_mean: 78.0
  fov_std: 6.0
  dataset_noise:
    mode: jpeg
    jpeg_quality_mean: 65
    jpeg_quality_std: 15

lighting:
  intensity_mean: 100000.0
  intensity_std: 70000.0
  visibility_choices: [true, false]

pallets:
  count_per_model: 3
