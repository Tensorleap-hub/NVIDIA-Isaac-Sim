extends: ../../../sdg_config_mean_std.yaml

run:
  num_frames: 128
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/base_v2/exp25_image_aug_cool_gain

environment:
  name: warehouse

distractors:
  groups:
  clutter_level: 1.1

camera:
  camera_height_mean: 1.5
  camera_height_std: 0.25
  camera_tilt_mean: -14.0
  camera_tilt_std: 4.0
  camera_yaw_std: 90.0
  fov_mean: 70.0
  fov_std: 5.0

lighting:
  intensity_mean: 130000
  intensity_std: 80000
  visibility_choices: [true]

image_augmentation:
  enabled: true
  brightness_gain_mean: 1.0
  brightness_gain_std: 0.0
  contrast_gain_mean: 1.0
  contrast_gain_std: 0.0
  gamma_mean: 1.0
  gamma_std: 0.0
  color_gain_mean: [0.94, 1.02, 1.08]
  color_gain_std: [0.02, 0.02, 0.02]

forklifts:
  count_per_model: 0
pallets:
  count_per_model: 0
