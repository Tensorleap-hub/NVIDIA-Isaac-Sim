extends: ../../sdg_config_mean_std.yaml

run:
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/kinematic_actors_stage1/forklift_duo_and_humans
  num_frames: 800

environment:
  name: warehouse_with_forklifts

camera:
  look_at: [0.0, 4.5, 1.0]
  position_mean: [-4.5, -2.5]
  position_std: [0.0, 0.0]
  camera_height_mean: 3.2
  camera_height_std: 0.0
  camera_tilt_mean: null
  camera_tilt_std: 0.0
  camera_yaw_mean: 180.0
  camera_yaw_std: 0.0
  camera_roll_mean: 0.0
  camera_roll_std: 0.0
  fov_mean: 95.0
  fov_std: 0.0

actors:
  enabled: true
  forklifts:
    enabled: true
    count_mean: 2.0
    count_std: 0.0
    count_min: 2
    count_max: 2
    assets:
      - /Isaac/Robots/Forklift/Forklift_A01.usd
    spawn:
      position_mean: [0.0, 4.0, 0.0]
      position_std: [5.0, 6.5, 0.0]
      rotation_mean: [0.0, 0.0, 180.0]
      rotation_std: [0.0, 0.0, 140.0]
      scale_mean: 1.6
      scale_std: 0.0
    motion:
      enabled: true
  humans:
    enabled: true
    # NOTE: using a warehouse prop as a visible surrogate until a valid human USD is available in your asset server.
    count_mean: 2.0
    count_std: 1.0
    count_min: 2
    count_max: 5
    assets:
      - /Isaac/Environments/Simple_Warehouse/Props/S_WetFloorSign.usd
    spawn:
      position_mean: [0.0, 4.0, 0.0]
      position_std: [3.0, 4.0, 0.0]
      rotation_mean: [0.0, 0.0, 180.0]
      rotation_std: [0.0, 0.0, 180.0]
      scale_mean: 1.6
      scale_std: 0.1
    motion:
      enabled: true
