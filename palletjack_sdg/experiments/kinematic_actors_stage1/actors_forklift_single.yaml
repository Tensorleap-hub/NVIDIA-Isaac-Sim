extends: ../../sdg_config_mean_std.yaml

run:
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/kinematic_actors_stage1/forklift_single
  num_frames: 500
  temporal_sequence: true

environment:
  name: warehouse_with_forklifts

camera:
  look_at: [0.0, 8.0, 1.0]
  position_mean: [-8.0, -8.0]
  position_std: [0.0, 0.0]
  camera_height_mean: 6.5
  camera_height_std: 0.0
  camera_tilt_mean: null
  camera_tilt_std: 0.0
  camera_yaw_mean: 180.0
  camera_yaw_std: 0.0
  camera_roll_mean: 0.0
  camera_roll_std: 0.0
  fov_mean: 125.0
  fov_std: 0.0
  motion:
    enabled: true
    velocity_mean: [0.070, 0.040, 0.0]
    velocity_std: [0.006, 0.006, 0.0]
    reverse_every_frames: 45
  motion_blur_strength_mean: 5.0
  motion_blur_strength_std: 0.0

actors:
  enabled: true
  forklifts:
    enabled: true
    count_mean: 1.0
    count_std: 0.0
    count_min: 1
    count_max: 1
    assets:
      - /Isaac/Robots/Forklift/Forklift_A01.usd
    spawn:
      position_mean: [0.0, 3.0, 0.0]
      position_std: [1.0, 1.5, 0.0]
      rotation_mean: [0.0, 0.0, 180.0]
      rotation_std: [0.0, 0.0, 160.0]
      scale_mean: 1.0
      scale_std: 0.0
    motion:
      enabled: true
      velocity_mean: [0.22, 0.08, 0.0]
      velocity_std: [0.020, 0.015, 0.0]
      reverse_every_frames: 30
  humans:
    enabled: false
