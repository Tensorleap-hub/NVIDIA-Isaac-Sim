extends: ../../../sdg_config_mean_std.yaml

run:
  num_frames: 128
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/base_v2/exp29_pallet_stacks_dense

# Tall pallet stacks (5 × 6 layers) with forklift and pallet distractors.
# Mid-height tilted camera to capture both stacks and palletjacks.

pallet_stacks:
  enabled: true
  num_stacks: 5
  layers: 6

camera:
  camera_height_mean: 2.8
  camera_height_std: 0.4
  camera_tilt_mean: -20.0
  camera_tilt_std: 5.0
  camera_yaw_mean: 180.0
  camera_yaw_std: 90.0
  fov_mean: 80.0
  fov_std: 6.0

lighting:
  intensity_mean: 110000.0
  intensity_std: 150000.0
