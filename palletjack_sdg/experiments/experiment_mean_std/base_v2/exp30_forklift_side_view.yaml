extends: ../../../sdg_config_mean_std.yaml

run:
  num_frames: 128
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/base_v2/exp30_forklift_side_view

# Forklift prominent from low side angle. Heavy clutter with DT cardboard boxes.
# Pallet stacks in background. Side-biased yaw distribution.

distractors:
  clutter_level: 1.4
  groups:
    CardBox:
      diversity: 5
      occurrence: 4

camera:
  camera_height_mean: 1.3
  camera_height_std: 0.2
  camera_tilt_mean: -8.0
  camera_tilt_std: 3.0
  camera_yaw_mean: 90.0
  camera_yaw_std: 40.0
  fov_mean: 75.0
  fov_std: 5.0

lighting:
  intensity_mean: 95000.0
  intensity_std: 180000.0

forklifts:
  count_per_model: 4
