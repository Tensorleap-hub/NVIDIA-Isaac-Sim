extends: ../../../sdg_config_mean_std.yaml

run:
  num_frames: 128
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/base_v2/exp24_image_aug_warm_gain

environment:
  name: warehouse

distractors:
  groups:
    Pallet:
      use: false
    Forklift:
      use: false
  clutter_level: 1.1

camera:
  camera_height_mean: 1.5
  camera_height_std: 0.25
  camera_tilt_mean: -14.0
  camera_tilt_std: 4.0
  fov_mean: 70.0
  fov_std: 5.0

image_augmentation:
  enabled: true
  brightness_gain_mean: 1.0
  brightness_gain_std: 0.0
  contrast_gain_mean: 1.0
  contrast_gain_std: 0.0
  gamma_mean: 1.0
  gamma_std: 0.0
  color_gain_mean: [1.08, 1.02, 0.94]
  color_gain_std: [0.02, 0.02, 0.02]
