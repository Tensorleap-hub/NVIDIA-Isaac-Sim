extends: ../../../sdg_config_mean_std.yaml

run:
  num_frames: 128
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/base_v2/exp28_image_aug_low_gamma

environment:
  name: warehouse

distractors:
  groups:
    Pallet:
      occurrence: 0
    Forklift:
      occurrence: 0
  clutter_level: 1.1

camera:
  camera_height_mean: 1.5
  camera_height_std: 0.25
  camera_tilt_mean: -14.0
  camera_tilt_std: 4.0
  fov_mean: 70.0
  fov_std: 5.0

image_augmentation:
  enabled: true
  brightness_gain_mean: 1.0
  brightness_gain_std: 0.0
  contrast_gain_mean: 1.0
  contrast_gain_std: 0.0
  gamma_mean: 0.88
  gamma_std: 0.06
  color_gain_mean: [1.0, 1.0, 1.0]
  color_gain_std: [0.0, 0.0, 0.0]
