extends: ../../../sdg_config_mean_std.yaml

run:
  num_frames: 128
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/base_v2/exp08_roll_variation_medium_noise

environment:
  name: warehouse

distractors:
  groups:
    BarelPlastic:
      occurrence: 0
    TrafficSigns:
      occurrence: 0
    Bucket:
      occurrence: 0
    PushCart:
      occurrence: 0
  clutter_level: 1.0

lighting:
  intensity_mean: 120000
  intensity_std: 60000
  visibility_choices: [true]

camera:
  camera_height_mean: 1.5
  camera_height_std: 0.25
  camera_tilt_mean: -16.0
  camera_tilt_std: 4.0
  camera_yaw_std: 90
  camera_roll_mean: 0.0
  camera_roll_std: 10.0
  fov_mean: 72.0
  fov_std: 5.0
  dataset_noise:
    enabled: true
    mode: gaussian
    sigma_mean: 8.0
    sigma_std: 1.5

palletjacks:
  count_per_model: 2

materials:
  textures:
    - /Isaac/Materials/Textures/Patterns/nv_stone_painted_grey.jpg
    - /Isaac/Materials/Textures/Patterns/nv_concrete_aged_with_lines.jpg

forklifts:
  count_per_model: 0
pallets:
  count_per_model: 0
