extends: ../../../sdg_config_mean_std.yaml
run:
  num_frames: 128
  data_dir: /isaac-sim/palletjack_sdg/palletjack_data/base_v2/exp33_pallet_stacks_low_light
pallet_stacks:
  enabled: true
  num_stacks: 5
  layers: 5
distractors:
  clutter_level: 0.8
  groups:
    Forklift:
      occurrence: 0
    Pallet:
      occurrence: 0
camera:
  camera_height_mean: 1.8
  camera_height_std: 0.3
  camera_tilt_mean: -12.0
  camera_tilt_std: 4.0
  fov_mean: 79.0
  fov_std: 5.0
  dataset_noise:
    mode: gaussian
    shot_scale_mean: 70.0
    shot_scale_std: 19.0
lighting:
  intensity_mean: 15000.0
  intensity_std: 25000.0
  visibility_choices:
  - true
