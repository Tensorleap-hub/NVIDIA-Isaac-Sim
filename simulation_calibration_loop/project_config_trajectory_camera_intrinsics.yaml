project_name: trajectory_camera_intrinsics
workspace_dir: ./workspace_trajectory_camera_intrinsics
seed_config_dir: ../palletjack_sdg/experiments/trajectory/base_v4
real_dataset_root: /home/ubuntu/loco_dataset
real_annotations_file: /home/ubuntu/warehouse3cls_traj_v2/valid/_annotations.coco.json
max_iterations: 15
iteration_batch_size: 4
isaac:
  script_path: ../palletjack_sdg/standalone_palletjack_trajectory_sdg.py
search_space:
  themes:
  - traj-camera-intrinsics
  exclude:
  - run.data_dir
  - run.num_frames
  - run.headless
  - cameras.ego.shutter_close_fraction
  - cameras.chase.enabled
  - cameras.ego.fisheye.enabled
  - cameras.ego.fisheye.k1
  - cameras.ego.fisheye.k2
  - cameras.ego.fisheye.k3
  - cameras.ego.fisheye.k4
  - capture.video
  - environment.name
  bounds:
    # ceiling 120 (was 110) so the search covers true ultrawide territory — the
    # old random-frame ultrawide seed was 112°, trajectory base_v1's was 108°,
    # but base_v4 keeps only one 90° wide seed, so TPE must be ABLE to reach
    # past 110 even without a pinned anchor there. Rectilinear 120° was already
    # render-validated by the full_warehouse perimeter loop (FOV120).
    cameras.ego.fov_mean:
    - 30.0
    - 120.0
    cameras.ego.fov_std:
    - 0.0
    - 8.0
    cameras.ego.f_stop:
    - 0.0
    - 8.0
    cameras.ego.focus_distance_m:
    - 2.0
    - 10.0
embedder_backend: rfdetr
rfdetr_embedder:
  checkpoint_path: /home/ubuntu/warehouse3cls_traj_v4b/output/rfdetr_traj_v4b_base/checkpoint_best_ema.pth
