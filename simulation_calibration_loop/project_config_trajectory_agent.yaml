project_name: trajectory_agent
workspace_dir: ./workspace_trajectory_agent
seed_config_dir: ../palletjack_sdg/experiments/trajectory/base_v4_fullwh
real_dataset_root: /home/ubuntu/datasets/loco_dataset
real_annotations_file: /home/ubuntu/datasets/loco_dataset/labels/loco-all-v1.json
# Target = low-perf cluster members (is_low_perf_root_member filter is fixed in data.py)
real_target_csv: /home/ubuntu/NVIDIA-Isaac-Sim/simulation_calibration_loop/targets/insight-4-samples.csv
max_iterations: 15
iteration_batch_size: 4
isaac:
  script_path: ../palletjack_sdg/standalone_palletjack_trajectory_sdg.py
search_space:
  themes:
  - traj-environment
  - traj-agent
  exclude:
  - run.data_dir
  - run.num_frames
  - run.headless
  - cameras.ego.shutter_close_fraction
  - cameras.chase.enabled
  - cameras.ego.fisheye.enabled
  - cameras.ego.fisheye.k1
  - cameras.ego.fisheye.k2
  - cameras.ego.fisheye.k3
  - cameras.ego.fisheye.k4
  - capture.video
  bounds:
    agent.speed_mps:
    - 0.3
    - 4.0
    agent.turn_rate_dps:
    - 30.0
    - 180.0
    # Environment pinned to full_warehouse for the neck/low-perf-target run —
    # the insight target is not an environment-selection question.
    environment.name:
    - full_warehouse
embedder_backend: dinov2
rfdetr_embedder:
  checkpoint_path: /home/ubuntu/warehouse3cls_traj_v4b/output/rfdetr_traj_v4b_base/checkpoint_best_ema.pth
tpe_sampler:
  n_startup_trials: 10
