project_name: dinov2_subset3_optuna_loop_camera_color_objects
workspace_dir: ./workspace_camera_color_objects
promoted_baseline_dir: ./promoted_baseline_theme_rounds
s3_best_runs_prefix: s3://nvidia-isaac-bucket/optuna-ec2/camera_color_objects/
seed_config_dir: ../palletjack_sdg/experiments/experiment_mean_std/base_v2
real_dataset_root: ../loco_dataset
real_annotations_file: ../loco_dataset/labels/loco-sub3-v1-train.json
max_iterations: 5
iteration_batch_size: 8
random_seed: 42
top_n_best_trials: 5
mmd_max_samples: 2000
base_pool:
  enabled: true
dino:
  model_name: dinov2_vitb14_reg
  repo: facebookresearch/dinov2
  batch_size: 32
  resize_size: 256
  image_size: 224
isaac:
  isaac_sim_path: /opt/IsaacSim
  script_path: ../palletjack_sdg/standalone_palletjack_sdg_mean_std.py
  headless: true
search_space:
  themes:
    - camera-color
    - objects
    - diversity
    - scene-objects
  include: []
  exclude:
    - run.data_dir
    - run.num_frames
    - run.headless
