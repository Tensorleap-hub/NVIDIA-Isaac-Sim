# 3 shorter rounds instead of 2 long ones: round-1 evidence showed every theme
# reached its optimum well before iteration 15 (env by iter 2, mount by 12,
# intrinsics never improved) — more cycles through the theme chain beats
# deeper single-theme searches once TPE has plateaued.
rounds: 3
common:
  promoted_baseline_dir: ./promoted_baseline_trajectory_dino
  max_iterations: 10
  iteration_batch_size: 4
  # Multi-seed evaluation: each candidate is generated once per seed and the
  # RGB frames are POOLED before embedding, so MMD-to-real reflects the config's
  # distribution (many layouts/trajectories) rather than one realization. The
  # seed set is FIXED across trials so ranking differences reflect the config,
  # not seed luck. sample_number is now PER-SEED, so total frames per trial =
  # sample_number * len(eval_seeds) = 15 * 4 = 60 (same budget as the old
  # single-run 60, but decorrelated across 4 layouts).
  sample_number: 15
  eval_seeds: [1, 2, 3, 4]
  embedder_backend: dinov2
  base_pool:
    enabled: true
    max_size: 60
    pin_seeds: true
  rfdetr_embedder:
    checkpoint_path: /home/ubuntu/warehouse3cls_traj_v4b/output/rfdetr_traj_v4b_base/checkpoint_best_ema.pth
    num_classes: 3
    layer_index: 3
    batch_size: 16
    resize_size: 256
    image_size: 224
configs:
# environment.name is NO LONGER a standalone theme: a 4-way categorical
# optimized alone against the promoted best wastes a full 15-iteration pass
# (round 1 spent 60 evals re-measuring 4 options). It is cheap but interacts
# with everything, so every theme below now carries traj-environment in its
# own search space and TPE explores it jointly with that theme's knobs.
#- project_config_trajectory_environment.yaml
# camera = intrinsics + mount merged into ONE joint space (they interact with
# each other and with env; round 1 searched them separately).
- project_config_trajectory_camera.yaml
- project_config_trajectory_camera_jitter.yaml
- project_config_trajectory_agent.yaml
- project_config_trajectory_scene.yaml
- project_config_trajectory_distractor_occurrence.yaml
# diversity layers in AFTER occurrence has converged (don't stack two fresh
# object themes in one round — it muddies attribution). Uncomment next round.
#- project_config_trajectory_distractor_diversity.yaml
# characters theme disabled: Isaac runs die at generation (omni.anim.people
# character spawn), stalling the whole round with endless retries. Optional per
# the plan; re-enable only after the crash is diagnosed + fixed.
#- project_config_trajectory_characters.yaml
# exploration-bounds (Stage 7): searches WHERE the camera roams (roam box as
# fractions of the env envelope). Add AFTER traj-environment has promoted a
# baseline env — the envelope is that env's tuned bounds_xy. Staged like the
# other object themes (don't stack a fresh axis in the same round). The Isaac
# script derives bounds_xy from trajectory.roam.* with a min_path feasibility
# floor + reverse-traversal frame fill, so a small box degrades gracefully
# instead of wedging the planner. Smoke-verified 2026-07-07.
#- project_config_trajectory_exploration_bounds.yaml
