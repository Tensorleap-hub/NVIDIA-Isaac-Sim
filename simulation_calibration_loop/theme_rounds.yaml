rounds: 2

# Common overrides applied to every per-theme config before each run.
# Any key here wins over the value in the individual project_config_*.yaml.
# promoted_baseline_dir is resolved relative to this file's location.
common:
  promoted_baseline_dir: ./promoted_baseline_theme_rounds_2
  max_iterations: 30
  iteration_batch_size: 4
  sample_number: 64     # maps to isaac.num_frames_override in each config
  base_pool:
    enabled: true
    max_size: 60
    pin_seeds: true

configs:
  - project_config_camera_lighting.yaml
  - project_config_noise.yaml
  - project_config_distractors_clutter.yaml
  - project_config_distractors_diversity.yaml
  - project_config_camera_color.yaml
  - project_config_scene_objects.yaml
