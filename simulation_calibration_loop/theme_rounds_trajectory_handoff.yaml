# Handoff test: 2 themes x 2 rounds, tiny numbers. Validates the parts the
# single-theme smoke did NOT: group B inheriting group A's promoted baseline,
# and round 2 re-optimizing each group against the updated baseline.
# Uses the SMOKE-ONLY placeholder checkpoint.
rounds: 2
common:
  promoted_baseline_dir: ./promoted_baseline_trajectory_handoff2
  max_iterations: 2
  iteration_batch_size: 1
  sample_number: 5           # -> isaac.num_frames_override
  embedder_backend: rfdetr
  base_pool:
    enabled: false        # skip 32-seed warmup; handoff logic is independent of base_pool
  rfdetr_embedder:
    checkpoint_path: /home/ubuntu/warehouse3cls_traj_v2/output/rfdetr_traj_v2_base/checkpoint_best_ema.pth
    num_classes: 3
    layer_index: 3
    batch_size: 16
    resize_size: 256
    image_size: 224
configs:
- project_config_trajectory_camera_intrinsics.yaml
- project_config_trajectory_camera_mount.yaml
