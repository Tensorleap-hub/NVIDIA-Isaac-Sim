# RF-DETR training config for 3-class warehouse detection:
#   0: pallet_truck  (palletjack in synthetic data)
#   1: forklift
#   2: pallet
#
# Usage:
#   rfdetr fit --config configs/rfdetr_warehouse3cls.yaml \
#     --model.train_config.init_args.dataset_dir /path/to/prepared_dataset
#
# Prepare the dataset first:
#   python scripts/prepare_loco_dataset.py --help
#   python scripts/prepare_synth_dataset.py --help

model:
  model_config:
    class_path: rfdetr.config.RFDETRBaseConfig
    init_args:
      num_classes: 3
      encoder: dinov2_windowed_small
  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_dir: /Users/orram/Tensorleap/data/warehouse/warehouse3cls_real
      output_dir: /Users/orram/Tensorleap/data/warehouse/warehouse3cls_real/output/rfdetr_base
      epochs: 100
      batch_size: 4
      grad_accum_steps: 4
      num_workers: 4
      tensorboard: true
      class_names:
        - pallet_truck
        - forklift
        - pallet
